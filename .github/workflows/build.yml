name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 渲染层自检 + publish
        shell: bash
        run: bash scripts/build-desktop.sh

      - name: 产物大小
        shell: bash
        run: |
          ls -la dist/publish/iread-plugin.exe
          du -sh dist/publish

      - uses: actions/upload-artifact@v4
        with:
          name: iread-win-x64
          path: dist/publish
          if-no-files-found: error
          retention-days: 14

  installer:
    name: NSIS 安装包
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安装 NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: 构建（含安装包）
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          bash scripts/build-desktop.sh --installer

      - uses: actions/upload-artifact@v4
        with:
          name: iread-setup
          path: dist/iread-setup.exe
          if-no-files-found: error
